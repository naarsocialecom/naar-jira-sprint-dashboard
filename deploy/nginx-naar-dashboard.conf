##
## /etc/nginx/sites-available/naar-dashboard
## Symlink: ln -s /etc/nginx/sites-available/naar-dashboard /etc/nginx/sites-enabled/
##

server {
    listen 80;
    server_name your-domain.com;          # <── change to your domain or IP

    # Redirect HTTP → HTTPS (remove this block if you're not using HTTPS yet)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;          # <── change to your domain or IP

    # ── SSL certs (replace with your certbot/letsencrypt paths) ──
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    server_tokens off;
    client_max_body_size 1m;

    # ── Password-protect the dashboard (it can post to Slack) ──
    # Create users:  sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/.naar-dashboard.htpasswd <user>
    auth_basic           "Naar Dashboard";
    auth_basic_user_file /etc/nginx/.naar-dashboard.htpasswd;

    # ── Logging ──
    access_log /var/log/nginx/naar-dashboard.access.log;
    error_log  /var/log/nginx/naar-dashboard.error.log;

    # ── Static files served directly by Nginx (faster than Flask) ──
    location /static/ {
        alias /opt/naar-live/frontend/static/;
        # Short cache: file names aren't versioned, so long/immutable caching would
        # keep serving old JS/CSS for days after a deploy.
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        gzip_static on;
    }

    # Health check for uptime monitors — no password needed
    location = /healthz {
        auth_basic off;
        proxy_pass http://127.0.0.1:5005;
    }

    # ── All other requests go to Gunicorn ──
    location / {
        proxy_pass         http://127.0.0.1:5005;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
